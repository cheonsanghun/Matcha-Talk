############################################
# Spring Boot 기본 설정
############################################
spring.application.name=project01
spring.config.import=optional:file:.env[.properties]
spring.profiles.active=db
spring.flyway.enabled=false

############################################
# 데이터소스 (수동으로 생성한 MySQL 사용)
############################################
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/match_talk_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

############################################
# Redis 세션
############################################
spring.session.store-type=redis
spring.session.redis.flush-mode=on-save
spring.session.redis.namespace=app:session
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

############################################
# 메일 (환경 변수 기반)
############################################
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

############################################
# Jackson & 로케일
############################################
spring.jackson.time-zone=Asia/Seoul
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.property-naming-strategy=SNAKE_CASE

############################################
# WebSocket/SockJS
############################################
spring.websocket.servlet.allowed-origins=*
spring.websocket.servlet.sockjs.heartbeat.time=25000
spring.websocket.servlet.sockjs.disconnect.delay=5000

############################################
# 서버 & 관리
############################################
server.port=8080
server.servlet.context-path=/
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SERVER_SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${SERVER_SESSION_COOKIE_SAMESITE:Lax}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

############################################
# 로깅
############################################
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.springframework.security=DEBUG

############################################
# 커스텀 설정
############################################
webrtc.ice.urls=${METERED_TURN_URLS:}
webrtc.ice.username=${METERED_TURN_USERNAME:}
webrtc.ice.credential=${METERED_TURN_CREDENTIAL:}

translate.base-url=${TRANSLATE_API_BASE_URL:}
translate.api-key=${TRANSLATE_API_KEY:}
translate.provider=${TRANSLATE_API_PROVIDER:generic}

papago.api.client-id=${PAPAGO_CLIENT_ID:}
papago.api.client-secret=${PAPAGO_CLIENT_SECRET:}
papago.api.url=${PAPAGO_API_URL:https://papago.apigw.ntruss.com/nmt/v1/translation}

jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://192.168.0.165:5173}
app.ws.allowed-origins=${APP_WS_ALLOWED_ORIGINS:}
app.mail.token.exp-seconds=${APP_MAIL_TOKEN_EXP_SECONDS:600}
app.mail.token.cooldown-seconds=${APP_MAIL_TOKEN_COOLDOWN_SECONDS:60}
app.mail.token.length=${APP_MAIL_TOKEN_LENGTH:6}

storage.presign.base-url=${FILE_PRESIGN_BASE_URL:}

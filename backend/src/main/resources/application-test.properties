# 로컬 개발용 간단 설정 (이메일/DB 없이 테스트)
# 이 프로필로 실행: --spring.profiles.active=test

# 인메모리 H2 데이터베이스 사용 (MySQL 없이 테스트)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 콘솔 활성화 (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JPA 설정
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 이메일 기능 비활성화 (콘솔 출력으로 대체)
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test@localhost
spring.mail.password=test

# 로깅 레벨
logging.level.org.springframework.web=DEBUG
logging.level.net.datasa=DEBUG
logging.level.org.hibernate.SQL=DEBUG

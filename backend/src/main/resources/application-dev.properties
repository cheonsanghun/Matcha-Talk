# 개발환경용 Spring Boot 설정
# MySQL 연결 정보 (로컬 개발용)
spring.datasource.url=jdbc:mysql://localhost:3306/match_talk_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root  
spring.datasource.password=your_password_here

# JPA 설정
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 이메일 설정 (Gmail SMTP - 개발용)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your_email@gmail.com
spring.mail.password=your_app_password_here
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# 이메일 인증 설정
app.mail.token.exp-seconds=600
app.mail.token.cooldown-seconds=60
app.mail.token.length=6

# 테스트용 설정
logging.level.org.springframework.web=DEBUG
